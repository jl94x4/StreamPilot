apply plugin: 'com.android.application'

// Release signing key. keystore.properties (gitignored) sits next to settings.gradle;
// see keystore.properties.example. Without it, assembleRelease builds unsigned.
def releaseKeystorePropsFile = rootProject.file('keystore.properties')
def releaseKeystoreProps = new Properties()
if (releaseKeystorePropsFile.exists()) {
    releaseKeystorePropsFile.withInputStream { releaseKeystoreProps.load(it) }
}

android {
    namespace "com.servermanagerportal.mediaplayer"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.streampilot.mediaplayer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 394
        // Settings shows this versionName. `npm run build:apk` auto-bumps both.
        versionName "1.0.394"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            cruncherEnabled = false
        }
    }
    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            if (releaseKeystorePropsFile.exists()) {
                // Relative paths resolve from plex-client/android, like keystore.properties.
                storeFile rootProject.file(releaseKeystoreProps['storeFile'])
                storePassword releaseKeystoreProps['storePassword']
                keyAlias releaseKeystoreProps['keyAlias']
                keyPassword releaseKeystoreProps['keyPassword']
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        debug {
            // Fire OS still checks JAR (v1) signatures. v2-only APKs install as “invalid”.
            signingConfig signingConfigs.debug
        }
        release {
            // Same v1+v2 rule as debug: Fire OS rejects v2-only APKs.
            if (releaseKeystorePropsFile.exists()) signingConfig signingConfigs.release
            // R8 can strip Capacitor plugin classes found by reflection. Test before enabling.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    testOptions {
        // Robolectric tests inflate the player menu row layouts.
        unitTests.includeAndroidResources = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.tvprovider:tvprovider:1.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Real android.net.Uri / org.json on the JVM for the player helper tests (.\gradlew.bat test).
    testImplementation "org.robolectric:robolectric:4.16.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
