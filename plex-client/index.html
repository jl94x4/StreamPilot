<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>StreamPilot</title>
  <script>
    window.__PLEX_CLIENT__ = window.__PLEX_CLIENT__ || {
      portalBaseUrl: '',
      nativePlayer: true,
      isTv: false,
      appVersion: ''
    };
    document.documentElement.dataset.plexClient = '1';

    // Leanback WebViews report a phone-sized CSS width (~960 on 1080p). Native
    // densityDpi does not change Chromium's layout width. Use CSS zoom (not
    // transform:scale) so hit-testing / D-pad Select / clicks keep working.
    (function () {
      var TARGET = 1920;
      var scheduled = false;

      function applyTvScale() {
        var vw = window.innerWidth || document.documentElement.clientWidth || TARGET;
        if (vw < 2) return;
        document.documentElement.dataset.tv = '1';
        document.documentElement.style.fontSize = '20px';
        // Narrow CSS viewport → zoom out so desktop density fits the screen.
        // Very wide CSS viewport (4K 1x) → zoom toward a 1920 design width.
        var zoom = '1';
        if (vw < TARGET * 0.92) {
          zoom = String(Math.max(0.45, Math.min(1, vw / TARGET)));
        } else if (vw > TARGET * 1.2) {
          zoom = String(Math.max(0.45, Math.min(1, TARGET / vw)));
        }
        document.documentElement.style.zoom = zoom;
        // Layout px are multiplied by this zoom on screen. Divide by it when a
        // gap must match desktop device pixels (details hero band).
        document.documentElement.style.setProperty('--tv-zoom', zoom);
      }

      function markTv() {
        try {
          delete document.documentElement.dataset.phone;
          delete document.documentElement.dataset.phoneNative;
        } catch (e) {}
        window.__PLEX_CLIENT__ = Object.assign({}, window.__PLEX_CLIENT__ || {}, { isTv: true });
        document.documentElement.dataset.tv = '1';
        document.documentElement.dataset.plexClient = '1';
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'viewport');
          document.head.appendChild(meta);
        }
        meta.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no');
        applyTvScale();
      }

      function schedule() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(function () {
          scheduled = false;
          if (document.documentElement.dataset.tv === '1' || (window.__PLEX_CLIENT__ && window.__PLEX_CLIENT__.isTv)) {
            applyTvScale();
          }
        });
      }

      function markPhone() {
        if (document.documentElement.dataset.tv === '1' || (window.__PLEX_CLIENT__ && window.__PLEX_CLIENT__.isTv)) {
          try {
            delete document.documentElement.dataset.phone;
            delete document.documentElement.dataset.phoneNative;
          } catch (e) {}
          return;
        }
        if (document.documentElement.dataset.phoneNative === '1') {
          document.documentElement.dataset.phone = '1';
          return;
        }
        var ua = navigator.userAgent || '';
        var coarse = false;
        var narrow = false;
        try { coarse = window.matchMedia('(hover: none) and (pointer: coarse)').matches; } catch (e) {}
        try { narrow = window.matchMedia('(max-width: 767px)').matches; } catch (e) {}
        var androidPhone = /Android/i.test(ua) && (/Mobile/i.test(ua) || /; wv\)/.test(ua));
        var iosPhone = /iPhone|iPod/i.test(ua);
        if (androidPhone || iosPhone || coarse || narrow) {
          document.documentElement.dataset.phone = '1';
        } else {
          try { delete document.documentElement.dataset.phone; } catch (e) {}
        }
      }

      window.__SMP_APPLY_TV_SCALE__ = applyTvScale;
      window.__SMP_MARK_TV__ = markTv;
      window.__SMP_MARK_PHONE__ = markPhone;
      window.addEventListener('resize', function () { schedule(); markPhone(); });
      window.addEventListener('orientationchange', function () { schedule(); markPhone(); });
      document.addEventListener('DOMContentLoaded', function () { schedule(); markPhone(); });

      // Apply ASAP on leanback / TV emulator (before Capacitor DeviceUi).
      try {
        var ua = navigator.userAgent || '';
        var noTouch = typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints === 0;
        var large = Math.max(window.screen && window.screen.width || 0, window.screen && window.screen.height || 0) >= 720;
        if (
          (/Android/i.test(ua) && /TV|BRAVIA|AFT|GoogleTV|Android TV|SHIELD/i.test(ua))
          || (/Android/i.test(ua) && noTouch && large)
        ) {
          markTv();
        } else {
          markPhone();
        }
      } catch (e) { /* ignore */ }
      markPhone();
    })();
  </script>

    html, body, #root { height: 100%; margin: 0; background: #07080c; color: #ffffff; }
    html, body, button, input, select, textarea {
      font-family: "Switzer", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    /* ── Boot splash: cinematic reveal ── */
    @keyframes boot-splash-glow-orbit {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes boot-splash-logo-in {
      0%   { opacity: 0; transform: translate3d(-120vw, 0, 0) scale(1.3); filter: blur(6px); }
      28%  { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
      /* IMPACT — overshot, squash */
      34%  { opacity: 1; transform: translate3d(4vw, 0, 0) scale(0.92, 1.06); filter: blur(0) brightness(1.8); }
      /* Recoil back */
      46%  { transform: translate3d(-3vw, 0, 0) scale(1.07, 0.96); filter: blur(0) brightness(1.2); }
      /* Second bounce */
      58%  { transform: translate3d(1.2vw, 0, 0) scale(0.97, 1.02); filter: blur(0) brightness(1); }
      /* Micro settle */
      72%  { transform: translate3d(-0.4vw, 0, 0) scale(1.01, 0.995); }
      100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: blur(0) brightness(1); }
    }
    /* shimmer removed */
    @keyframes boot-splash-bar-fill {
      0%   { width: 0; }
      20%  { width: 24%; }
      55%  { width: 58%; }
      80%  { width: 82%; }
      100% { width: 100%; }
    }
    @keyframes boot-splash-bar-glow {
      0%, 100% { box-shadow: 0 0 8px rgba(245, 158, 11, 0.3), 0 0 18px rgba(245, 158, 11, 0.1); }
      50%      { box-shadow: 0 0 14px rgba(245, 158, 11, 0.55), 0 0 32px rgba(245, 158, 11, 0.2); }
    }
    @keyframes boot-splash-pulse-ring {
      0%   { transform: translate(-50%, -50%) scale(0.85); opacity: 0.5; }
      50%  { transform: translate(-50%, -50%) scale(1.15); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
    }
    @keyframes boot-splash-particle {
      0%   { opacity: 0; transform: translateY(0) scale(0); }
      15%  { opacity: 1; transform: translateY(-8px) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.3); }
    }
    @keyframes boot-splash-version-in {
      0%   { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    #boot-splash {
      position: relative;
      box-sizing: border-box;
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
      background: #07080c;
    }
    /* Ambient radial glow behind the logo */
    #boot-splash::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(110vw, 52rem);
      height: min(110vw, 52rem);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(245, 158, 11, 0.1) 0%,
        rgba(245, 158, 11, 0.04) 30%,
        transparent 65%
      );
      pointer-events: none;
      z-index: 0;
    }
    /* Orbiting glow ring */
    #boot-splash::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(46vw, 22rem);
      height: min(46vw, 22rem);
      transform-origin: center center;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: rgba(245, 158, 11, 0.25);
      border-right-color: rgba(245, 158, 11, 0.08);
      animation: boot-splash-glow-orbit 4s linear infinite;
      margin-top: calc(min(46vw, 22rem) / -2);
      margin-left: calc(min(46vw, 22rem) / -2);
      pointer-events: none;
      z-index: 0;
    }
    #boot-splash .boot-splash-mark {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: boot-splash-logo-in 1.05s cubic-bezier(0.22, 0.6, 0.35, 1) 0.1s both;
    }
    /* shimmer removed */
    #boot-splash img {
      width: min(78vw, 36rem);
      height: auto;
      max-height: 22vh;
      object-fit: contain;
      filter: drop-shadow(0 0 40px rgba(245, 158, 11, 0.25))
              drop-shadow(0 16px 32px rgba(0, 0, 0, 0.6));
    }
    /* Pulse ring behind logo */
    #boot-splash .boot-splash-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(88vw, 42rem);
      height: min(22vh, 12rem);
      border: 1px solid rgba(245, 158, 11, 0.15);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      animation: boot-splash-pulse-ring 2.8s ease-in-out 0.6s infinite;
      pointer-events: none;
      z-index: 0;
    }
    /* Floating particles */
    #boot-splash .boot-splash-particles {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(70vw, 32rem);
      height: 6rem;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    #boot-splash .boot-splash-particles span {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.6);
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.4);
      animation: boot-splash-particle 2.6s ease-out infinite;
    }
    #boot-splash .boot-splash-particles span:nth-child(1) { left: 12%; animation-delay: 0.4s; }
    #boot-splash .boot-splash-particles span:nth-child(2) { left: 28%; animation-delay: 1.1s; }
    #boot-splash .boot-splash-particles span:nth-child(3) { left: 44%; animation-delay: 0.7s; }
    #boot-splash .boot-splash-particles span:nth-child(4) { left: 60%; animation-delay: 1.6s; }
    #boot-splash .boot-splash-particles span:nth-child(5) { left: 76%; animation-delay: 0.2s; }
    #boot-splash .boot-splash-particles span:nth-child(6) { left: 88%; animation-delay: 1.3s; }
    /* Progress bar: determinate fill with glow */
    #boot-splash .boot-splash-progress {
      position: absolute;
      left: 50%;
      bottom: max(12%, 3.75rem);
      z-index: 1;
      width: min(14rem, 38vw);
      height: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      transform: translateX(-50%);
    }
    #boot-splash .boot-splash-progress > span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #b45309, #f59e0b, #fde68a);
      animation:
        boot-splash-bar-fill 2.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s forwards,
        boot-splash-bar-glow 1.4s ease-in-out 0.3s infinite;
    }
    #boot-splash .boot-splash-version {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(3.5%, 1rem);
      z-index: 1;
      margin: 0;
      text-align: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.32);
      animation: boot-splash-version-in 0.6s ease-out 0.8s both;
    }
    #boot-splash .boot-splash-version:empty {
      display: none;
    }
    /* CSS zoom on html shrinks 100vh to a slice of the TV. Size the splash
       in layout px so after zoom it still covers the physical screen. */
    html[data-tv="1"] #boot-splash {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10000;
      width: calc(100vw / var(--tv-zoom, 1));
      height: calc(100vh / var(--tv-zoom, 1));
      min-height: calc(100vh / var(--tv-zoom, 1));
      padding: 0;
      background: #07080c;
    }
    html[data-tv="1"] #boot-splash img {
      width: min(62vw, 40rem);
      max-height: 24vh;
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .boot-splash-mark,
      /* shimmer removed */
      #boot-splash .boot-splash-progress > span,
      #boot-splash::after,
      #boot-splash .boot-splash-ring,
      #boot-splash .boot-splash-particles span {
        animation: none !important;
      }
      #boot-splash .boot-splash-progress > span {
        width: 100% !important;
      }
    }
    html[data-tv="1"] {
      -webkit-tap-highlight-color: transparent;
      font-size: 20px;
      --color-text: 255 255 255;
      --color-muted: 255 255 255;
      --tv-page-surface: 6 10 16;

      --tv-focus-stroke: calc(2px / var(--tv-zoom, 1));

    html[data-tv="1"] body,

    html[data-tv="1"] .text-text,

    /* Poster names under every row. */
    html[data-tv="1"] .player-poster-caption,

    html[data-tv="1"] .player-poster-caption,
    html[data-tv="1"] [data-tv-poster-btn="1"] + div,

    }
    /* All home / library / details rail headers — Satoshi + plex accent mark. */
    html[data-tv="1"] .player-row-header {
      position: relative;
      gap: 0.7rem !important;
      margin: 0 0 0.15rem;
      padding-left: 0;
    }
    html[data-tv="1"] .player-row-header-mark {
      display: inline-block !important;
      width: 1.15em;

    html[data-tv="1"] .player-row-header-title,
    html[data-tv="1"] .player-row-header h2,
    html[data-tv="1"] .player-row-header > button,
    html[data-tv="1"] .player-home-rows [data-tv-row="1"] h2,
    html[data-tv="1"] .player-home-rows [data-tv-row="1"] > div > button,
    html[data-tv="1"] .player-home-rows .player-row-header-title,
    html[data-tv="1"] [data-tv-library="1"] .player-row-header-title {
      font-family: "Satoshi", "Switzer", "Helvetica Neue", Helvetica, Arial, sans-serif !important;

      color: #fff !important;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);

    /* Non-TV fallback mark (portal / phone). */
    .player-row-header-mark {
      display: inline-block;

      filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.4));
    }
    @keyframes play-mark-pulse {
      0%, 100% { opacity: 0.3; filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.2)); }
      50%      { opacity: 1;   filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.7)); }

    /* Row marker "Bar (classic)": the original line, sized as it was before the play icon. */
    .player-row-header-mark.player-row-header-mark--bar {

    /* Title pages: an image still loading fades in; a cached one is shown at once (FadeImg). */

    /* TV cast / guest rows run on to the screen edge: they reach into the right padding the

      width: calc(100% + var(--details-pr, 0px)) !important;
      max-width: none !important;
      margin-right: calc(-1 * var(--details-pr, 0px)) !important;
