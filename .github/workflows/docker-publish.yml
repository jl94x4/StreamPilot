name: Publish Docker image

on:
  push:
    branches: [main, beta, testing, nightly]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/jl94x4/streampilot
  # Same tags, so existing Unraid/Compose installs keep updating until their repository is changed.
  IMAGE_NAME_LEGACY: ghcr.io/jl94x4/server-manager-portal

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve package version floor from main
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_VER=$(node -pe "require('./package.json').version")
          FLOOR="$LOCAL_VER"
          if [[ "${GITHUB_REF}" != "refs/heads/main" && "${GITHUB_REF}" != refs/tags/* ]]; then
            git fetch origin main --depth=1
            MAIN_VER=$(git show origin/main:package.json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            # Use main's version when it is newer so beta/testing are not stuck one release behind.
            FLOOR=$(LOCAL_VER="$LOCAL_VER" MAIN_VER="$MAIN_VER" node -e "
              const local = process.env.LOCAL_VER;
              const main = process.env.MAIN_VER;
              const parse = (v) => String(v || '0').replace(/^v/i,'').split(/[.+-]/).map((p) => parseInt(p,10)||0);
              const a = parse(main), b = parse(local);
              let newer = local;
              for (let i = 0; i < Math.max(a.length,b.length); i++) {
                const d = (a[i]||0) - (b[i]||0);
                if (d > 0) { newer = main; break; }
                if (d < 0) break;
              }
              process.stdout.write(newer);
            ")
            echo "Local package.json=${LOCAL_VER}; main=${MAIN_VER}; floor=${FLOOR}"
          else
            echo "Using branch package.json=${LOCAL_VER}"
          fi
          echo "floor=${FLOOR}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Avoid docker/metadata-action — it calls the GitHub API and has been
      # failing with intermittent Unicorn/500 HTML errors on branch pushes.
      - name: Set image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}"
          LEGACY="${IMAGE_NAME_LEGACY}"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TAGS=("${IMAGE}:sha-${SHA_SHORT}")

          case "${GITHUB_REF}" in
            refs/heads/main)
              TAGS+=("${IMAGE}:latest")
              ;;
            refs/heads/beta)
              TAGS+=("${IMAGE}:beta")
              ;;
            refs/heads/testing)
              TAGS+=("${IMAGE}:testing")
              ;;
            refs/heads/nightly)
              TAGS+=("${IMAGE}:nightly")
              ;;
            refs/tags/v*)
              VERSION="${GITHUB_REF#refs/tags/}"
              TAGS+=("${IMAGE}:${VERSION}" "${IMAGE}:latest")
              # Also tag without leading v when present (v1.2.3 -> 1.2.3)
              if [[ "${VERSION}" == v* ]]; then
                TAGS+=("${IMAGE}:${VERSION#v}")
              fi
              ;;
          esac

          if [[ -n "${LEGACY}" ]]; then
            LEGACY_TAGS=()
            for tag in "${TAGS[@]}"; do
              LEGACY_TAGS+=("${LEGACY}:${tag##*:}")
            done
            TAGS+=("${LEGACY_TAGS[@]}")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "Image tags:"
          printf '  - %s\n' "${TAGS[@]}"

      # Docker Hub base pulls (node:*) occasionally time out on GitHub runners.
      # Retry once before failing the job.
      #
      # BuildKit OCI provenance/SBOM attestations stay off on the image push:
      # GHCR has historically returned "unknown blob" for those indexes, and
      # Unraid update checks need Docker Schema 2 (oci-mediatypes=false).
      # Provenance + SBOM are attached afterwards via GitHub artifact attestations.
      - name: Build and push
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          # Unraid Docker update checks report "not available" for OCI-only
          # manifests; publish Docker Schema 2 media types instead.
          outputs: type=image,push=true,oci-mediatypes=false
          build-args: |
            GIT_SHA=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            PACKAGE_VERSION_FLOOR=${{ steps.ver.outputs.floor }}

      - name: Retry build and push
        id: retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          outputs: type=image,push=true,oci-mediatypes=false
          build-args: |
            GIT_SHA=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            PACKAGE_VERSION_FLOOR=${{ steps.ver.outputs.floor }}

      - name: Resolve image digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [[ -z "${DIGEST}" ]]; then
            DIGEST="${{ steps.retry.outputs.digest }}"
          fi
          if [[ -z "${DIGEST}" ]]; then
            echo "No image digest from build/retry" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Resolved digest ${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (legacy image name)
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME_LEGACY }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # Pin by commit SHA (avoid mutable version tags after the 2026 trivy-action compromise).
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true
          version: latest

      - name: Generate SBOM
        run: >
          trivy image
          --format cyclonedx
          --output sbom.cdx.json
          "${IMAGE_NAME}@${{ steps.digest.outputs.digest }}"

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Attest SBOM (legacy image name)
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME_LEGACY }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      # Advisory only on publish: node/Debian base images often carry unfixed OS CVEs.
      # Blocking CRITICAL/HIGH lives in security-audit.yml (fs + npm/pip). Do not fail
      # GHCR/Unraid publishes after a successful push — and don't use continue-on-error
      # (that still paints a red “error” annotation on an otherwise green run).
      - name: Scan published image (CRITICAL/HIGH, advisory)
        id: image_scan
        run: |
          set -uo pipefail
          set +e
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --output trivy-image.txt \
            "${IMAGE_NAME}@${{ steps.digest.outputs.digest }}"
          code=$?
          set -e
          if [[ -f trivy-image.txt ]]; then
            cat trivy-image.txt
          fi
          if [[ "${code}" -ne 0 ]]; then
            echo "::warning::Trivy found CRITICAL/HIGH findings on the published image (advisory only; base image CVEs do not fail docker-publish)."
          else
            echo "Trivy image scan clean for CRITICAL/HIGH (ignore-unfixed)."
          fi
          exit 0

      - name: Upload Trivy image report
        if: always() && steps.image_scan.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-${{ github.sha }}
          path: trivy-image.txt
          if-no-files-found: ignore
          retention-days: 14
