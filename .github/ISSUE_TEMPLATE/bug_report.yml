name: Bug report
description: Something in StreamPilot isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/jl94x4/StreamPilot/issues) first.
        **Remove tokens, API keys and passwords** from any logs or screenshots before posting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StreamPilot version
      description: Shown in Settings / the footer (e.g. v1.9.0).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Docker / Docker Compose
        - Unraid
        - Manual (Node.js)
        - Other
    validations:
      required: true
  - type: dropdown
    id: media-server
    attributes:
      label: Media server
      options:
        - Plex
        - Jellyfin
        - Not related
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Setup wizard
        - Users / access & expiry
        - Requests / Discover
        - Collexions
        - Analytics / dashboards
        - Notifications / email
        - Settings
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser / device
      description: Only needed for UI issues.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Container or browser console logs. This is rendered as code automatically.
      render: shell
